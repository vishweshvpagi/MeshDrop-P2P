name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'Mobile/**'
      - '.github/workflows/build-android-apk.yml'

jobs:
  build-apk:
    name: Build Standalone APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'Mobile/package-lock.json'

      - name: Install dependencies
        working-directory: Mobile
        run: npm ci

      - name: Generate Native Android Project (Expo Prebuild)
        working-directory: Mobile
        run: npx expo prebuild --platform android --clean

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3

      - name: Build Android Release APK
        working-directory: Mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Locate and Rename APK
        id: find-apk
        run: |
          APK_PATH=$(find Mobile/android/app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "ERROR: APK was not generated!"
            exit 1
          fi
          echo "Found APK: $APK_PATH"
          mkdir -p release-output
          cp "$APK_PATH" release-output/MeshDrop.apk
          echo "apk_path=release-output/MeshDrop.apk" >> $GITHUB_OUTPUT

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MeshDrop-Android-APK
          path: release-output/MeshDrop.apk
          if-no-files-found: error

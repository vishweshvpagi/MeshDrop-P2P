name: Create Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'Mobile/package-lock.json'

      - name: Install dependencies
        working-directory: Mobile
        run: npm ci

      - name: Generate Native Android Project
        working-directory: Mobile
        run: npx expo prebuild --platform android --clean

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3

      - name: Build Android Release APK
        working-directory: Mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Stage APK Output
        run: |
          APK_PATH=$(find Mobile/android/app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "ERROR: APK was not found!"
            exit 1
          fi
          mkdir -p dist
          cp "$APK_PATH" dist/MeshDrop.apk

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-release-apk
          path: dist/MeshDrop.apk

  build-laptop:
    name: Build Laptop Release (Windows / Fat JAR)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'Frontend/package-lock.json'

      - name: Install Frontend Dependencies
        working-directory: Frontend
        run: npm ci

      - name: Run Laptop Packaging Script
        shell: powershell
        run: |
          .\package-laptop.ps1 -BuildNative -Version "${{ github.ref_name || inputs.tag_name }}"

      - name: Upload Laptop Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: laptop-releases
          path: |
            dist/*.jar
            dist/*.zip

  publish-release:
    name: Publish GitHub Release
    needs: [build-android, build-laptop]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Android Artifact
        uses: actions/download-artifact@v4
        with:
          name: android-release-apk
          path: release-files

      - name: Download Laptop Artifacts
        uses: actions/download-artifact@v4
        with:
          name: laptop-releases
          path: release-files

      - name: Inspect Release Files
        run: |
          ls -la release-files/

      - name: Determine Release Tag
        id: vars
        run: |
          if [ -n "${{ github.ref_name }}" ] && [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ inputs.tag_name || 'v1.0.0' }}" >> $GITHUB_OUTPUT
          fi

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: MeshDrop ${{ steps.vars.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release-files/MeshDrop.apk
            release-files/MeshDrop.jar
            release-files/MeshDrop-Laptop-*.zip
            release-files/MeshDrop-Windows-*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
